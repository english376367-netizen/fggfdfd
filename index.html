const DATA={"questions":[{"n":1,"prompt":"Choose the best option to complete blank (1).","opts":{"A":"which","B":"whose","C":"whom","D":"where"},"answer":"B","explain":"“Whose” chỉ sở hữu, thay cho “people’s”: những người mà trải nghiệm của họ có ích.","section":1},{"n":2,"prompt":"Choose the best option to complete blank (2).","opts":{"A":"spend","B":"to spend","C":"spent","D":"spending"},"answer":"D","explain":"Sau giới từ “by” dùng V-ing: by spending time with older relatives and neighbours.","section":1},{"n":3,"prompt":"Choose the best option to complete blank (3).","opts":{"A":"meaningful","B":"meaning","C":"meaningfully","D":"mean"},"answer":"A","explain":"Cần tính từ “meaningful” bổ nghĩa cho danh từ “perspective”.","section":1},{"n":4,"prompt":"Choose the best option to complete blank (4).","opts":{"A":"family carefully recorded stories","B":"recorded carefully stories family","C":"carefully recorded family stories","D":"stories recorded family carefully"},"answer":"C","explain":"Cụm đúng: carefully + recorded + family + stories (trạng từ – phân từ – danh từ).","section":1},{"n":5,"prompt":"Choose the best option to complete blank (5).","opts":{"A":"take","B":"do","C":"make","D":"raise"},"answer":"A","explain":"“Take notes” là cụm cố định chỉ hành động ghi chép trong buổi phỏng vấn.","section":1},{"n":6,"prompt":"Choose the best option to complete blank (6).","opts":{"A":"for","B":"at","C":"in","D":"to Read the following leaflet and mark A, B, C or D to indicate the option that best fits each numbered blank from 7 to 12. LEAFLET – CELEBRATE CULTURES IN OUR COMMUNITY! Would you like to discover traditions without leaving your town? (7) ______ local families have offered to share their music, food and stories at our Cultural Connections Day. Student volunteers will (8) ______ interactive booths where visitors can try traditional games and crafts. (9) ______ you have never attended a cultural event before, you will find plenty to enjoy. Watch (10) ______ performances and listen to the stories behind them. Our goal is to encourage (11) ______ for different beliefs and customs, not simply to entertain visitors. Come with an open mind and learn (12) ______ one another. The event takes place in the community hall this Sunday, and admission is free for everyone!"},"answer":"D","explain":"Thành ngữ “bring something to life” = làm cho điều gì trở nên sống động.","section":1},{"n":7,"prompt":"Choose the best option to complete blank (7).","opts":{"A":"Much","B":"Little","C":"Several","D":"Any"},"answer":"C","explain":"“Several” đi với danh từ đếm được số nhiều “local families”.","section":2},{"n":8,"prompt":"Choose the best option to complete blank (8).","opts":{"A":"put off","B":"set up","C":"look down on","D":"get over"},"answer":"B","explain":"“Set up interactive booths” nghĩa là dựng và bố trí các gian hoạt động.","section":2},{"n":9,"prompt":"Choose the best option to complete blank (9).","opts":{"A":"Unless","B":"Because","C":"As soon as","D":"Even if"},"answer":"D","explain":"“Even if” = ngay cả khi; thể hiện điều kiện nhượng bộ, không loại trừ người mới.","section":2},{"n":10,"prompt":"Choose the best option to complete blank (10).","opts":{"A":"colourful","B":"colourfully","C":"colour","D":"colouring"},"answer":"A","explain":"Cần tính từ “colourful” bổ nghĩa cho danh từ số nhiều “performances”.","section":2},{"n":11,"prompt":"Choose the best option to complete blank (11).","opts":{"A":"respectful","B":"respectfully","C":"respect","D":"respecting"},"answer":"C","explain":"Sau “encourage” cần danh từ “respect”: encourage respect for different customs.","section":2},{"n":12,"prompt":"Choose the best option to complete blank (12).","opts":{"A":"with","B":"from","C":"on","D":"upon Mark A, B, C or D to indicate the best arrangement of utterances or sentences from 13 to 17."},"answer":"B","explain":"“Learn from one another” là cụm cố định, nghĩa là học hỏi lẫn nhau.","section":2},{"n":13,"prompt":"Choose the correct order to make a meaningful conversation.","opts":{"A":"b – a – c","B":"a – c – b","C":"b – c – a","D":"c – b – a"},"answer":"A","explain":"Thứ tự b – a – c: thông báo câu chuyện → hỏi thêm → kể cống hiến của bác sĩ.","arrangementLines":[{"letter":"a","text":"Minh: Really? What made her story remarkable?"},{"letter":"b","text":"Lan: Our class is reading about a doctor who worked in remote villages."},{"letter":"c","text":"Lan: She spent years providing medical care to families who could not afford it."}],"section":3},{"n":14,"prompt":"Choose the correct order to make a meaningful conversation.","opts":{"A":"a – b – d – e – c","B":"c – a – b – e – d","C":"c – b – a – d – e","D":"b – c – a – e – d"},"answer":"C","explain":"Thứ tự c – b – a – d – e: giới thiệu → hỏi hỗ trợ → đề nghị → hỏi chi tiết → đáp.","arrangementLines":[{"letter":"a","text":"Linh: Could you design a poster to invite other classes?"},{"letter":"b","text":"Nam: Sounds interesting. How can I help?"},{"letter":"c","text":"Linh: Our class is organising a cultural exchange next Thursday."},{"letter":"d","text":"Nam: Certainly. What details should I include?"},{"letter":"e","text":"Linh: Please add the time, place and names of the activities."}],"section":3},{"n":15,"prompt":"Choose the correct order to complete the email.","opts":{"A":"d – c – b – a – e","B":"b – c – d – e – a","C":"e – b – d – c – a","D":"b – d – c – e – a"},"answer":"D","explain":"Thứ tự b – d – c – e – a: nêu mục đích → nguồn tin → đề xuất → hỏi → kết thư.","arrangementLines":[{"letter":"a","text":"Thank you for considering my request. I look forward to your reply."},{"letter":"b","text":"I am writing to ask whether I could volunteer at Saturday’s local history exhibition."},{"letter":"c","text":"I would be pleased to welcome visitors or help arrange the photographs."},{"letter":"d","text":"I saw the announcement on the school website yesterday."},{"letter":"e","text":"Could you please let me know when volunteers should arrive?"}],"section":3},{"n":16,"prompt":"Choose the correct order to make a coherent paragraph.","opts":{"A":"e – a – c – b – d","B":"a – e – b – c – d","C":"a – c – e – d – b","D":"d – a – b – c – e"},"answer":"B","explain":"Thứ tự a – e – b – c – d: ý chính → giải pháp → ví dụ → kết quả → lợi ích.","arrangementLines":[{"letter":"a","text":"A simple plan can help families reduce food waste without spending extra money."},{"letter":"b","text":"For example, they can plan meals before shopping and store fresh food properly."},{"letter":"c","text":"As a result, fewer ingredients are forgotten or thrown away."},{"letter":"d","text":"These habits can also lower household expenses over time."},{"letter":"e","text":"Rather than buying more than they need, families can check what is already in their kitchen."}],"section":3},{"n":17,"prompt":"Choose the correct order to make a coherent paragraph.","opts":{"A":"b – c – a – d – e","B":"a – b – c – e – d","C":"b – a – d – c – e","D":"c – b – e – a – d Read the following passage and mark A, B, C or D to indicate the option that best fits each numbered blank from 18 to 22. A STREAM OF SMALL CHANGES In a coastal town, a student named An noticed plastic wrappers accumulating along a stream near her school. Her decision to act (18) ______. At first, some classmates doubted that a small group could solve a problem affecting the whole neighbourhood. Rather than giving up, An invited a science teacher (19) ______. Together, they studied which kinds of litter appeared most often and placed labelled collection bins near the market. After collecting data for four weeks, (20) ______. The group shared its findings with local shop owners, who agreed to reduce unnecessary packaging. (21) ______. Seeing the cleaner stream, more residents joined the weekend activities. An later explained that the project was never only about rubbish: it was about encouraging neighbours to cooperate. (22) ______."},"answer":"A","explain":"Thứ tự b – c – a – d – e: lợi ích → minh họa → khó khăn → giải pháp → kết luận.","arrangementLines":[{"letter":"a","text":"However, cultural misunderstandings may occur when people judge unfamiliar customs too quickly."},{"letter":"b","text":"Learning about other cultures can broaden young people’s perspectives."},{"letter":"c","text":"For instance, international school projects allow students to share different ways of celebrating important occasions."},{"letter":"d","text":"Therefore, asking respectful questions is often more helpful than making assumptions."},{"letter":"e","text":"With curiosity and openness, students can build friendships across cultural differences."}],"section":3},{"n":18,"prompt":"Choose the best option to complete blank (18).","opts":{"A":"which inspired other pupils without explaining its purpose","B":"having created a new opportunity for local residents","C":"whose aim was to collect old newspapers","D":"soon inspired a wider community effort"},"answer":"D","explain":"Chủ ngữ “Her decision to act” đòi hỏi vị ngữ hữu hạn “soon inspired”.","section":4},{"n":19,"prompt":"Choose the best option to complete blank (19).","opts":{"A":"whose research findings had remained unpublished","B":"who helped them design a practical survey","C":"that visitors had interviewed at the market","D":"having been given a survey on a previous occasion"},"answer":"B","explain":"“Who helped ...” là mệnh đề quan hệ chỉ người và đúng vai trò của thầy giáo.","section":4},{"n":20,"prompt":"Choose the best option to complete blank (20).","opts":{"A":"the stream had become a popular tourist attraction","B":"the market was moved to another district","C":"the students presented a simple plan to the local council","D":"the bins were damaged by a severe storm"},"answer":"C","explain":"Cụm “After collecting ...” phải cùng chủ thể với mệnh đề chính: “the students”.","section":4},{"n":21,"prompt":"Choose the best option to complete blank (21).","opts":{"A":"As a result, fewer single-use bags were handed out at local shops","B":"On the contrary, the stream had never contained any rubbish","C":"For example, the town was founded several centuries earlier","D":"Nevertheless, the students decided that pollution was unimportant"},"answer":"A","explain":"“As a result” chỉ hệ quả của việc giảm bao bì: ít túi dùng một lần hơn.","section":4},{"n":22,"prompt":"Choose the best option to complete blank (22).","opts":{"A":"Although the project could only work in coastal towns","B":"Because no community member had agreed to help","C":"While environmental issues are unrelated to local communities","D":"Her experience shows that persistent local action can lead to lasting change Read the following passage and mark A, B, C or D to indicate the correct answer to each question from 23 to 30. KEEPING FOOD TRADITIONS ALIVE Traditional dishes can reveal a great deal about the people who prepare them. A recipe may reflect local weather, available ingredients and important family occasions. When older relatives teach children to cook, they often share memories as well as practical skills. In this way, food can connect generations and strengthen a sense of belonging. Some communities create cookbooks to record these experiences. Volunteers interview home cooks, write down recipes and include photographs of family celebrations. These cookbooks preserve stories that might otherwise be forgotten. They also help younger people understand why certain ingredients and methods became important to their communities. Food traditions do not always remain unchanged. When families move to new places, they may adapt familiar dishes using ingredients available nearby. A family may replace one vegetable with another while keeping the meal's special role in a celebration. Such changes show that traditions can develop without losing their cultural meaning. Sharing recipes with new neighbours can also encourage curiosity and mutual respect. Schools and community centres sometimes organise cooking days at which people from different backgrounds prepare meals together. Sharing a meal does not require everyone to have the same background. However, organisers must consider costs, food allergies and the risk of presenting one dish as representative of an entire culture. With careful planning, these events offer opportunities to learn from one another rather than rely on stereotypes."},"answer":"D","explain":"Câu kết hoàn chỉnh, khái quát sức mạnh của hành động địa phương bền bỉ.","section":4},{"n":23,"prompt":"Which of the following is NOT mentioned as a benefit of food traditions?","opts":{"A":"Passing down family memories","B":"Encouraging respect for other cultures","C":"Guaranteeing high incomes for every home cook","D":"Strengthening connections between generations"},"answer":"C","explain":"Bài nêu ký ức, kết nối và tôn trọng văn hóa; không hề hứa hẹn thu nhập cao.","section":5},{"n":24,"prompt":"The word “They” in paragraph 2 refers to ______.","opts":{"A":"community cookbooks","B":"local markets","C":"traditional ingredients","D":"family photographs"},"answer":"A","explain":"“They” ở đầu câu cuối đoạn 2 thay cho “These cookbooks” ở câu liền trước.","section":5},{"n":25,"prompt":"The word “preserve” in paragraph 2 is OPPOSITE in meaning to ______.","opts":{"A":"protect","B":"erase","C":"maintain","D":"safeguard"},"answer":"B","explain":"Preserve = giữ gìn; erase = xóa bỏ, làm mất dấu vết. Ba từ còn lại gần nghĩa với preserve.","section":5},{"n":26,"prompt":"The word “adapt” in paragraph 3 is closest in meaning to ______.","opts":{"A":"reject","B":"repeat","C":"ignore","D":"adjust"},"answer":"D","explain":"Adapt a dish = điều chỉnh món ăn cho phù hợp điều kiện mới; “adjust” tương đương về nghĩa.","section":5},{"n":27,"prompt":"Which statement is TRUE according to the passage?","opts":{"A":"Recipes must remain identical after families move.","B":"A dish can change ingredients while keeping its cultural significance.","C":"Community cookbooks never include photographs.","D":"Food events are free from all practical difficulties."},"answer":"B","explain":"Đoạn 3: có thể đổi nguyên liệu nhưng vẫn giữ ý nghĩa văn hóa của món ăn.","section":5},{"n":28,"prompt":"Which option best paraphrases the sentence “Sharing a meal does not require everyone to have the same background” in paragraph 4?","opts":{"A":"Only people from one culture can enjoy a meal together.","B":"People must share a language before they can share food.","C":"People from different backgrounds can connect through a shared meal.","D":"Sharing meals prevents people from learning new traditions."},"answer":"C","explain":"Ý gốc: người khác nền văn hóa vẫn có thể kết nối qua bữa ăn chung.","section":5},{"n":29,"prompt":"In which paragraph does the writer discuss practical challenges of organising food events?","opts":{"A":"Paragraph 4","B":"Paragraph 2","C":"Paragraph 1","D":"Paragraph 3"},"answer":"A","explain":"Đoạn 4 đề cập chi phí, dị ứng thực phẩm và nguy cơ rập khuôn một nền văn hóa qua một món ăn.","section":5},{"n":30,"prompt":"In which paragraph are community cookbooks described as a way of recording traditions?","opts":{"A":"Paragraph 3","B":"Paragraph 4","C":"Paragraph 1","D":"Paragraph 2 Read the following passage and mark A, B, C or D to indicate the correct answer to each question from 31 to 40. RETHINKING THE LIFE OF OUR CLOTHES Affordable clothing allows more people to enjoy different styles, but the rapid turnover of fashion trends raises environmental questions. Some garments are worn only a few times before being replaced. As a result, discussions about sustainable fashion now focus not only on how clothes are made but also on how long people use them and what happens when they are discarded. Producing fabric requires energy, raw materials and water. In some manufacturing regions, clean water is scarce, so factories must use it carefully. Poorly treated wastewater from dyeing can damage rivers, while synthetic fabrics may release tiny fibres during washing. These effects vary according to the materials and production methods used. It would therefore be misleading to assume that every factory has exactly the same environmental impact. Consumers can reduce waste by choosing durable garments, following care instructions and repairing minor damage. Washing clothes only when necessary may help them last longer. Buying second-hand items or exchanging clothes with friends offers further possibilities. Yet personal choices alone cannot address problems created earlier in the supply chain. Businesses and public institutions also have a role to play. Local repair cafés are becoming places where volunteers teach simple sewing skills. They help visitors replace missing buttons and mend torn seams, extending the useful life of clothes already owned. These gatherings also make repairing a social activity instead of a difficult task that people must attempt alone. Nevertheless, access to such services remains uneven, especially in areas without community centres or volunteer groups. [I] Making clothing more sustainable requires cooperation among consumers, businesses and public institutions. [II] The latter two groups can influence the conditions under which garments are manufactured and sold. [III] Consumers, meanwhile, can question product quality and support brands that share reliable information. [IV] No single action will solve the problem, but better production practices combined with more thoughtful consumption can make a meaningful difference."},"answer":"D","explain":"Đoạn 2 nói sách cộng đồng ghi công thức, ảnh và câu chuyện của các gia đình.","section":5},{"n":31,"prompt":"Where in paragraph 5 does the following sentence best fit? “For example, companies can disclose information about suppliers, while governments can set standards for wastewater treatment.”","opts":{"A":"[I]","B":"[III]","C":"[II]","D":"[IV]"},"answer":"C","explain":"Chèn [III]: ví dụ về doanh nghiệp và chính quyền làm rõ “the latter two groups”.","section":6},{"n":32,"prompt":"The word “scarce” in paragraph 2 is OPPOSITE in meaning to ______.","opts":{"A":"plentiful","B":"limited","C":"insufficient","D":"rare"},"answer":"A","explain":"Scarce = khan hiếm; plentiful = dồi dào. Ba từ còn lại đều diễn tả sự thiếu hoặc hiếm.","section":6},{"n":33,"prompt":"The word “durable” in paragraph 3 is closest in meaning to ______.","opts":{"A":"fashionable","B":"inexpensive","C":"lightweight","D":"long-lasting"},"answer":"D","explain":"Durable = bền, có thể sử dụng lâu; long-lasting là nghĩa gần nhất trong ngữ cảnh quần áo.","section":6},{"n":34,"prompt":"The word “They” in paragraph 4 refers to ______.","opts":{"A":"sewing machines","B":"community centres","C":"local repair cafés","D":"damaged fabrics"},"answer":"C","explain":"“They help visitors ...” thay cho “Local repair cafés” ở câu trước đoạn 4.","section":6},{"n":35,"prompt":"Which of the following is NOT TRUE according to the passage?","opts":{"A":"Untreated wastewater from dyeing can harm rivers.","B":"All clothing factories have exactly the same environmental impact.","C":"Repair cafés may help people learn to fix damaged clothes.","D":"Personal shopping choices cannot solve every production problem."},"answer":"B","explain":"Đoạn 2 nêu tác động của nhà máy khác nhau theo vật liệu và quy trình sản xuất.","section":6},{"n":36,"prompt":"Which option best summarises paragraph 3?","opts":{"A":"Buying more fashionable clothes is the only way to reduce waste.","B":"Consumers cannot take any action to reduce clothing waste.","C":"Washing clothes more often always extends their life.","D":"Taking care of and reusing garments can cut waste, but individual efforts have limits."},"answer":"D","explain":"Đoạn 3: dùng và sửa quần áo lâu hơn giúp giảm rác, nhưng cá nhân không thể làm hết.","section":6},{"n":37,"prompt":"Which statement is TRUE according to the passage?","opts":{"A":"Repair cafés can teach visitors basic sewing skills.","B":"Synthetic fabrics never release tiny fibres.","C":"All neighbourhoods have equal access to repair services.","D":"Governments have no responsibility for wastewater standards."},"answer":"A","explain":"Đoạn 4 xác nhận tình nguyện viên ở repair cafés dạy may vá cơ bản và hỗ trợ sửa quần áo.","section":6},{"n":38,"prompt":"Which option best paraphrases the sentence “Yet personal choices alone cannot address problems created earlier in the supply chain” in paragraph 3?","opts":{"A":"Individual shoppers can fully control every stage of manufacturing.","B":"Environmental problems begin only after clothes are sold.","C":"Consumer action helps, but production-related issues also need wider solutions.","D":"People should stop trying to make sustainable shopping choices."},"answer":"C","explain":"Việc mua sắm có ý thức hữu ích, nhưng vấn đề khâu sản xuất cần giải pháp rộng hơn.","section":6},{"n":39,"prompt":"What can be inferred from the passage?","opts":{"A":"Repairing clothes has no environmental advantages.","B":"Improving fashion sustainability requires action by both producers and consumers.","C":"The cheapest garment is always the most sustainable option.","D":"Fashion businesses cannot disclose information about their suppliers."},"answer":"B","explain":"Đoạn 3 và 5 cho thấy cả người sản xuất lẫn người tiêu dùng đều phải hành động.","section":6},{"n":40,"prompt":"Which title best summarises the passage?","opts":{"A":"The Rise of Luxury Clothing Brands","B":"Why Traditional Clothing Has Disappeared","C":"Sustainable Fashion: Responsibility Beyond the Shopper","D":"The History of Sewing Machines"},"answer":"C","explain":"Nhan đề bao quát môi trường thời trang và trách nhiệm không chỉ ở người mua.","section":6}],"sections":[{"id":1,"title":"TASK 1 – ADVERTISEMENT","range":[1,6],"passage":"ADVERTISEMENT – HERITAGE VOICES: STORIES WORTH SHARING","text":"Every family has stories worth sharing. Our school's Heritage Voices Project invites students to interview people (1) ______ experiences can teach us valuable lessons. By (2) ______ time with older relatives and neighbours, participants will discover how daily life has changed. Each interview can offer a (3) ______ perspective on courage and kindness. At our exhibition next month, we will display (4) ______ alongside family photographs. Volunteers should (5) ______ notes during conversations and ask permission before making recordings. Together, we can bring these memories (6) ______ life for the next generation. Visit the school library on Friday to register and receive an interview guide!","translation":"QUẢNG CÁO – TIẾNG NÓI DI SẢN: NHỮNG CÂU CHUYỆN ĐÁNG ĐƯỢC CHIA SẺ\nMỗi gia đình đều có những câu chuyện đáng được chia sẻ. Dự án Tiếng nói Di sản của trường chúng tôi mời học sinh phỏng vấn những người mà trải nghiệm của họ có thể dạy chúng ta những bài học quý giá. Bằng cách dành thời gian với người thân lớn tuổi và hàng xóm, người tham gia sẽ khám phá cuộc sống hằng ngày đã thay đổi như thế nào. Mỗi cuộc phỏng vấn có thể mang đến một góc nhìn ý nghĩa về lòng can đảm và sự tử tế. Tại triển lãm vào tháng tới, chúng tôi sẽ trưng bày những câu chuyện gia đình được ghi chép cẩn thận cùng với ảnh gia đình. Tình nguyện viên nên ghi chép trong các cuộc trò chuyện và xin phép trước khi ghi âm. Cùng nhau, chúng ta có thể làm cho những ký ức này sống động đối với thế hệ tiếp theo. Hãy đến thư viện trường vào thứ Sáu để đăng ký và nhận hướng dẫn phỏng vấn!"},{"id":2,"title":"TASK 2 – LEAFLET","range":[7,12],"passage":"LEAFLET – CELEBRATE CULTURES IN OUR COMMUNITY!","text":"Would you like to discover traditions without leaving your town? (7) ______ local families have offered to share their music, food and stories at our Cultural Connections Day. Student volunteers will (8) ______ interactive booths where visitors can try traditional games and crafts. (9) ______ you have never attended a cultural event before, you will find plenty to enjoy. Watch (10) ______ performances and listen to the stories behind them. Our goal is to encourage (11) ______ for different beliefs and customs, not simply to entertain visitors. Come with an open mind and learn (12) ______ one another. The event takes place in the community hall this Sunday, and admission is free for everyone!","translation":"TỜ RƠI – HÃY TÔN VINH CÁC NỀN VĂN HÓA TRONG CỘNG ĐỒNG!\nBạn có muốn khám phá các truyền thống mà không cần rời khỏi thị trấn của mình không? Một số gia đình địa phương đã đề nghị chia sẻ âm nhạc, thức ăn và những câu chuyện của họ tại Ngày Kết nối Văn hóa. Các tình nguyện viên học sinh sẽ dựng các gian hoạt động tương tác, nơi khách tham quan có thể thử các trò chơi và đồ thủ công truyền thống. Ngay cả khi bạn chưa từng tham dự một sự kiện văn hóa, bạn vẫn sẽ tìm thấy nhiều điều thú vị. Hãy xem những màn trình diễn đầy màu sắc và lắng nghe những câu chuyện đằng sau chúng. Mục tiêu của chúng tôi là khuyến khích sự tôn trọng đối với các niềm tin và phong tục khác nhau, chứ không chỉ đơn thuần là giải trí cho khách tham quan. Hãy đến với tâm trí cởi mở và học hỏi lẫn nhau. Sự kiện diễn ra tại hội trường cộng đồng vào Chủ nhật này và mọi người đều được vào cửa miễn phí!"},{"id":3,"title":"TASK 3 – ARRANGEMENT","range":[13,17],"passage":null,"text":null,"translation":""},{"id":4,"title":"TASK 4 – EXTENDED CLOZE","range":[18,22],"passage":"A STREAM OF SMALL CHANGES","text":"In a coastal town, a student named An noticed plastic wrappers accumulating along a stream near her school. Her decision to act (18) ______. At first, some classmates doubted that a small group could solve a problem affecting the whole neighbourhood. Rather than giving up, An invited a science teacher (19) ______. Together, they studied which kinds of litter appeared most often and placed labelled collection bins near the market. After collecting data for four weeks, (20) ______. The group shared its findings with local shop owners, who agreed to reduce unnecessary packaging. (21) ______. Seeing the cleaner stream, more residents joined the weekend activities. An later explained that the project was never only about rubbish: it was about encouraging neighbours to cooperate. (22) ______.","translation":"DÒNG CHẢY CỦA NHỮNG THAY ĐỔI NHỎ\nTại một thị trấn ven biển, một học sinh tên An nhận thấy các mảnh bao bì nhựa tích tụ dọc con suối gần trường. Quyết định hành động của bạn ấy nhanh chóng truyền cảm hứng cho một nỗ lực rộng lớn hơn trong cộng đồng. Ban đầu, một số bạn cùng lớp nghi ngờ rằng một nhóm nhỏ có thể giải quyết vấn đề ảnh hưởng đến cả khu dân cư. Thay vì bỏ cuộc, An mời một giáo viên khoa học giúp các bạn thiết kế một cuộc khảo sát thiết thực. Cùng nhau, họ nghiên cứu loại rác nào xuất hiện thường xuyên nhất và đặt các thùng thu gom có nhãn gần chợ. Sau khi thu thập dữ liệu trong bốn tuần, các học sinh trình bày một kế hoạch đơn giản với chính quyền địa phương. Nhóm chia sẻ những phát hiện với các chủ cửa hàng địa phương, những người đồng ý giảm bao bì không cần thiết. Kết quả là, số túi dùng một lần được phát tại các cửa hàng giảm xuống. Khi nhìn thấy con suối sạch hơn, nhiều cư dân tham gia các hoạt động cuối tuần. Sau này, An giải thích rằng dự án không chỉ xoay quanh rác thải mà còn nhằm khuyến khích hàng xóm hợp tác. Trải nghiệm của bạn ấy cho thấy hành động bền bỉ tại địa phương có thể dẫn đến thay đổi lâu dài."},{"id":5,"title":"TASK 5 – READING COMPREHENSION","range":[23,30],"passage":"D. Her experience shows that persistent local action can lead to lasting change","text":"Read the following passage and mark A, B, C or D to indicate the correct answer to each question from 23 to 30.\n\nKEEPING FOOD TRADITIONS ALIVE\n\nTraditional dishes can reveal a great deal about the people who prepare them. A recipe may reflect local weather, available ingredients and important family occasions. When older relatives teach children to cook, they often share memories as well as practical skills. In this way, food can connect generations and strengthen a sense of belonging.\n\nSome communities create cookbooks to record these experiences. Volunteers interview home cooks, write down recipes and include photographs of family celebrations. These cookbooks preserve stories that might otherwise be forgotten. They also help younger people understand why certain ingredients and methods became important to their communities.","translation":"GIỮ GÌN TRUYỀN THỐNG ẨM THỰC\nCác món ăn truyền thống có thể tiết lộ nhiều điều về những người chế biến chúng. Một công thức nấu ăn có thể phản ánh thời tiết địa phương, nguyên liệu sẵn có và những dịp quan trọng của gia đình. Khi người thân lớn tuổi dạy trẻ em nấu ăn, họ thường chia sẻ những kỷ niệm cũng như kỹ năng thực hành. Bằng cách này, thức ăn có thể kết nối các thế hệ và củng cố cảm giác gắn bó.\nMột số cộng đồng tạo ra sách dạy nấu ăn để ghi lại những trải nghiệm này. Các tình nguyện viên phỏng vấn những người nấu ăn tại nhà, ghi lại công thức và đưa vào ảnh các buổi lễ gia đình. Những cuốn sách này lưu giữ các câu chuyện mà nếu không có thể sẽ bị lãng quên. Chúng cũng giúp người trẻ hiểu vì sao một số nguyên liệu và phương pháp chế biến trở nên quan trọng đối với cộng đồng.\nTruyền thống ẩm thực không phải lúc nào cũng giữ nguyên. Khi các gia đình chuyển đến nơi mới, họ có thể điều chỉnh những món ăn quen thuộc bằng cách sử dụng nguyên liệu có sẵn ở gần đó. Một gia đình có thể thay loại rau này bằng loại rau khác nhưng vẫn giữ vai trò đặc biệt của món ăn trong một dịp lễ. Những thay đổi như vậy cho thấy truyền thống có thể phát triển mà không mất đi ý nghĩa văn hóa. Chia sẻ công thức với hàng xóm mới cũng có thể khuyến khích sự tò mò và tôn trọng lẫn nhau.\nCác trường học và trung tâm cộng đồng đôi khi tổ chức ngày hội nấu ăn, nơi những người có xuất thân khác nhau cùng chuẩn bị món ăn. Việc chia sẻ một bữa ăn không đòi hỏi mọi người phải có cùng nền tảng. Tuy nhiên, ban tổ chức phải cân nhắc chi phí, dị ứng thực phẩm và nguy cơ xem một món ăn là đại diện cho cả một nền văn hóa. Với sự chuẩn bị cẩn thận, những sự kiện này tạo cơ hội để học hỏi lẫn nhau thay vì dựa vào những định kiến."},{"id":6,"title":"TASK 6 – ADVANCED READING","range":[31,40],"passage":"Read the following passage and mark A, B, C or D to indicate the correct answer to each question from 31 to 40.","text":"RETHINKING THE LIFE OF OUR CLOTHES\n\nAffordable clothing allows more people to enjoy different styles, but the rapid turnover of fashion trends raises environmental questions. Some garments are worn only a few times before being replaced. As a result, discussions about sustainable fashion now focus not only on how clothes are made but also on how long people use them and what happens when they are discarded.\n\nProducing fabric requires energy, raw materials and water. In some manufacturing regions, clean water is scarce, so factories must use it carefully. Poorly treated wastewater from dyeing can damage rivers, while synthetic fabrics may release tiny fibres during washing. These effects vary according to the materials and production methods used. It would therefore be misleading to assume that every factory has exactly the same environmental impact.\n\nConsumers can reduce waste by choosing durable garments, following care instructions and repairing minor damage. Washing clothes only when necessary may help them last longer. Buying second-hand items or exchanging clothes with friends offers further possibilities. Yet personal choices alone cannot address problems created earlier in the supply chain. Businesses and public institutions also have a role to play.\n\nLocal repair cafés are becoming places where volunteers teach simple sewing skills. They help visitors replace missing buttons and mend torn seams, extending the useful life of clothes already owned. These gatherings also make repairing a social activity instead of a difficult task that people must attempt alone. Nevertheless, access to such services remains uneven, especially in areas without community centres or volunteer groups.","translation":"SUY NGẪM LẠI VỀ VÒNG ĐỜI CỦA QUẦN ÁO\nQuần áo giá cả phải chăng giúp nhiều người có thể tận hưởng các phong cách khác nhau, nhưng sự thay đổi nhanh chóng của xu hướng thời trang đặt ra những vấn đề về môi trường. Một số trang phục chỉ được mặc vài lần trước khi bị thay thế. Vì vậy, các cuộc thảo luận về thời trang bền vững hiện nay không chỉ tập trung vào cách quần áo được sản xuất mà còn vào thời gian mọi người sử dụng chúng và điều gì xảy ra khi chúng bị loại bỏ.\nSản xuất vải đòi hỏi năng lượng, nguyên liệu thô và nước. Ở một số khu vực sản xuất, nước sạch khan hiếm, vì vậy các nhà máy phải sử dụng nước cẩn thận. Nước thải từ quá trình nhuộm không được xử lý đúng cách có thể làm hại sông ngòi, trong khi vải tổng hợp có thể thải ra những sợi cực nhỏ khi giặt. Những tác động này thay đổi tùy theo vật liệu và phương pháp sản xuất. Vì vậy, cho rằng mọi nhà máy đều có tác động môi trường giống hệt nhau là không chính xác.\nNgười tiêu dùng có thể giảm rác thải bằng cách chọn quần áo bền, làm theo hướng dẫn bảo quản và sửa chữa những hư hỏng nhỏ. Chỉ giặt quần áo khi cần thiết có thể giúp chúng sử dụng được lâu hơn. Mua đồ đã qua sử dụng hoặc trao đổi quần áo với bạn bè cũng là những lựa chọn khác. Tuy nhiên, lựa chọn cá nhân không thể giải quyết các vấn đề phát sinh trước đó trong chuỗi cung ứng. Doanh nghiệp và các tổ chức công cũng có vai trò cần thực hiện.\nCác quán cà phê sửa chữa địa phương đang trở thành nơi tình nguyện viên dạy những kỹ năng may vá đơn giản. Họ giúp khách thay cúc áo bị mất và vá đường may bị rách, kéo dài thời gian sử dụng của quần áo mà mọi người đang sở hữu. Những buổi gặp gỡ này cũng biến việc sửa chữa thành hoạt động xã hội thay vì nhiệm vụ khó khăn mà mỗi người phải tự làm một mình. Tuy nhiên, khả năng tiếp cận các dịch vụ như vậy vẫn không đồng đều, đặc biệt ở những khu vực không có trung tâm cộng đồng hoặc nhóm tình nguyện.\n[I] Việc làm cho quần áo bền vững hơn đòi hỏi sự hợp tác giữa người tiêu dùng, doanh nghiệp và các tổ chức công. [II] Hai nhóm sau có thể tác động đến các điều kiện sản xuất và bán quần áo. [III] Trong khi đó, người tiêu dùng có thể đặt câu hỏi về chất lượng sản phẩm và ủng hộ các thương hiệu chia sẻ thông tin đáng tin cậy. [IV] Không một hành động đơn lẻ nào có thể giải quyết vấn đề, nhưng các phương pháp sản xuất tốt hơn kết hợp với tiêu dùng có suy nghĩ có thể tạo ra khác biệt đáng kể."}],"translations":{"ADVERTISEMENT – HERITAGE VOICES: STORIES WORTH SHARING":"QUẢNG CÁO – TIẾNG NÓI DI SẢN: NHỮNG CÂU CHUYỆN ĐÁNG ĐƯỢC CHIA SẺ\nMỗi gia đình đều có những câu chuyện đáng được chia sẻ. Dự án Tiếng nói Di sản của trường chúng tôi mời học sinh phỏng vấn những người mà trải nghiệm của họ có thể dạy chúng ta những bài học quý giá. Bằng cách dành thời gian với người thân lớn tuổi và hàng xóm, người tham gia sẽ khám phá cuộc sống hằng ngày đã thay đổi như thế nào. Mỗi cuộc phỏng vấn có thể mang đến một góc nhìn ý nghĩa về lòng can đảm và sự tử tế. Tại triển lãm vào tháng tới, chúng tôi sẽ trưng bày những câu chuyện gia đình được ghi chép cẩn thận cùng với ảnh gia đình. Tình nguyện viên nên ghi chép trong các cuộc trò chuyện và xin phép trước khi ghi âm. Cùng nhau, chúng ta có thể làm cho những ký ức này sống động đối với thế hệ tiếp theo. Hãy đến thư viện trường vào thứ Sáu để đăng ký và nhận hướng dẫn phỏng vấn!","LEAFLET – CELEBRATE CULTURES IN OUR COMMUNITY!":"TỜ RƠI – HÃY TÔN VINH CÁC NỀN VĂN HÓA TRONG CỘNG ĐỒNG!\nBạn có muốn khám phá các truyền thống mà không cần rời khỏi thị trấn của mình không? Một số gia đình địa phương đã đề nghị chia sẻ âm nhạc, thức ăn và những câu chuyện của họ tại Ngày Kết nối Văn hóa. Các tình nguyện viên học sinh sẽ dựng các gian hoạt động tương tác, nơi khách tham quan có thể thử các trò chơi và đồ thủ công truyền thống. Ngay cả khi bạn chưa từng tham dự một sự kiện văn hóa, bạn vẫn sẽ tìm thấy nhiều điều thú vị. Hãy xem những màn trình diễn đầy màu sắc và lắng nghe những câu chuyện đằng sau chúng. Mục tiêu của chúng tôi là khuyến khích sự tôn trọng đối với các niềm tin và phong tục khác nhau, chứ không chỉ đơn thuần là giải trí cho khách tham quan. Hãy đến với tâm trí cởi mở và học hỏi lẫn nhau. Sự kiện diễn ra tại hội trường cộng đồng vào Chủ nhật này và mọi người đều được vào cửa miễn phí!","A STREAM OF SMALL CHANGES":"DÒNG CHẢY CỦA NHỮNG THAY ĐỔI NHỎ\nTại một thị trấn ven biển, một học sinh tên An nhận thấy các mảnh bao bì nhựa tích tụ dọc con suối gần trường. Quyết định hành động của bạn ấy nhanh chóng truyền cảm hứng cho một nỗ lực rộng lớn hơn trong cộng đồng. Ban đầu, một số bạn cùng lớp nghi ngờ rằng một nhóm nhỏ có thể giải quyết vấn đề ảnh hưởng đến cả khu dân cư. Thay vì bỏ cuộc, An mời một giáo viên khoa học giúp các bạn thiết kế một cuộc khảo sát thiết thực. Cùng nhau, họ nghiên cứu loại rác nào xuất hiện thường xuyên nhất và đặt các thùng thu gom có nhãn gần chợ. Sau khi thu thập dữ liệu trong bốn tuần, các học sinh trình bày một kế hoạch đơn giản với chính quyền địa phương. Nhóm chia sẻ những phát hiện với các chủ cửa hàng địa phương, những người đồng ý giảm bao bì không cần thiết. Kết quả là, số túi dùng một lần được phát tại các cửa hàng giảm xuống. Khi nhìn thấy con suối sạch hơn, nhiều cư dân tham gia các hoạt động cuối tuần. Sau này, An giải thích rằng dự án không chỉ xoay quanh rác thải mà còn nhằm khuyến khích hàng xóm hợp tác. Trải nghiệm của bạn ấy cho thấy hành động bền bỉ tại địa phương có thể dẫn đến thay đổi lâu dài.","D. Her experience shows that persistent local action can lead to lasting change":"GIỮ GÌN TRUYỀN THỐNG ẨM THỰC\nCác món ăn truyền thống có thể tiết lộ nhiều điều về những người chế biến chúng. Một công thức nấu ăn có thể phản ánh thời tiết địa phương, nguyên liệu sẵn có và những dịp quan trọng của gia đình. Khi người thân lớn tuổi dạy trẻ em nấu ăn, họ thường chia sẻ những kỷ niệm cũng như kỹ năng thực hành. Bằng cách này, thức ăn có thể kết nối các thế hệ và củng cố cảm giác gắn bó.\nMột số cộng đồng tạo ra sách dạy nấu ăn để ghi lại những trải nghiệm này. Các tình nguyện viên phỏng vấn những người nấu ăn tại nhà, ghi lại công thức và đưa vào ảnh các buổi lễ gia đình. Những cuốn sách này lưu giữ các câu chuyện mà nếu không có thể sẽ bị lãng quên. Chúng cũng giúp người trẻ hiểu vì sao một số nguyên liệu và phương pháp chế biến trở nên quan trọng đối với cộng đồng.\nTruyền thống ẩm thực không phải lúc nào cũng giữ nguyên. Khi các gia đình chuyển đến nơi mới, họ có thể điều chỉnh những món ăn quen thuộc bằng cách sử dụng nguyên liệu có sẵn ở gần đó. Một gia đình có thể thay loại rau này bằng loại rau khác nhưng vẫn giữ vai trò đặc biệt của món ăn trong một dịp lễ. Những thay đổi như vậy cho thấy truyền thống có thể phát triển mà không mất đi ý nghĩa văn hóa. Chia sẻ công thức với hàng xóm mới cũng có thể khuyến khích sự tò mò và tôn trọng lẫn nhau.\nCác trường học và trung tâm cộng đồng đôi khi tổ chức ngày hội nấu ăn, nơi những người có xuất thân khác nhau cùng chuẩn bị món ăn. Việc chia sẻ một bữa ăn không đòi hỏi mọi người phải có cùng nền tảng. Tuy nhiên, ban tổ chức phải cân nhắc chi phí, dị ứng thực phẩm và nguy cơ xem một món ăn là đại diện cho cả một nền văn hóa. Với sự chuẩn bị cẩn thận, những sự kiện này tạo cơ hội để học hỏi lẫn nhau thay vì dựa vào những định kiến.","Read the following passage and mark A, B, C or D to indicate the correct answer to each question from 31 to 40.":"SUY NGẪM LẠI VỀ VÒNG ĐỜI CỦA QUẦN ÁO\nQuần áo giá cả phải chăng giúp nhiều người có thể tận hưởng các phong cách khác nhau, nhưng sự thay đổi nhanh chóng của xu hướng thời trang đặt ra những vấn đề về môi trường. Một số trang phục chỉ được mặc vài lần trước khi bị thay thế. Vì vậy, các cuộc thảo luận về thời trang bền vững hiện nay không chỉ tập trung vào cách quần áo được sản xuất mà còn vào thời gian mọi người sử dụng chúng và điều gì xảy ra khi chúng bị loại bỏ.\nSản xuất vải đòi hỏi năng lượng, nguyên liệu thô và nước. Ở một số khu vực sản xuất, nước sạch khan hiếm, vì vậy các nhà máy phải sử dụng nước cẩn thận. Nước thải từ quá trình nhuộm không được xử lý đúng cách có thể làm hại sông ngòi, trong khi vải tổng hợp có thể thải ra những sợi cực nhỏ khi giặt. Những tác động này thay đổi tùy theo vật liệu và phương pháp sản xuất. Vì vậy, cho rằng mọi nhà máy đều có tác động môi trường giống hệt nhau là không chính xác.\nNgười tiêu dùng có thể giảm rác thải bằng cách chọn quần áo bền, làm theo hướng dẫn bảo quản và sửa chữa những hư hỏng nhỏ. Chỉ giặt quần áo khi cần thiết có thể giúp chúng sử dụng được lâu hơn. Mua đồ đã qua sử dụng hoặc trao đổi quần áo với bạn bè cũng là những lựa chọn khác. Tuy nhiên, lựa chọn cá nhân không thể giải quyết các vấn đề phát sinh trước đó trong chuỗi cung ứng. Doanh nghiệp và các tổ chức công cũng có vai trò cần thực hiện.\nCác quán cà phê sửa chữa địa phương đang trở thành nơi tình nguyện viên dạy những kỹ năng may vá đơn giản. Họ giúp khách thay cúc áo bị mất và vá đường may bị rách, kéo dài thời gian sử dụng của quần áo mà mọi người đang sở hữu. Những buổi gặp gỡ này cũng biến việc sửa chữa thành hoạt động xã hội thay vì nhiệm vụ khó khăn mà mỗi người phải tự làm một mình. Tuy nhiên, khả năng tiếp cận các dịch vụ như vậy vẫn không đồng đều, đặc biệt ở những khu vực không có trung tâm cộng đồng hoặc nhóm tình nguyện.\n[I] Việc làm cho quần áo bền vững hơn đòi hỏi sự hợp tác giữa người tiêu dùng, doanh nghiệp và các tổ chức công. [II] Hai nhóm sau có thể tác động đến các điều kiện sản xuất và bán quần áo. [III] Trong khi đó, người tiêu dùng có thể đặt câu hỏi về chất lượng sản phẩm và ủng hộ các thương hiệu chia sẻ thông tin đáng tin cậy. [IV] Không một hành động đơn lẻ nào có thể giải quyết vấn đề, nhưng các phương pháp sản xuất tốt hơn kết hợp với tiêu dùng có suy nghĩ có thể tạo ra khác biệt đáng kể."}};
let sectionId=1, index=0, chosen={};
const $=id=>document.getElementById(id);
function unlock(){if($('pw').value==='367'){$('login').classList.add('hidden');$('app').classList.remove('hidden');buildNav();render()}else $('loginMsg').textContent='Incorrect password. Please try again.'}
function currentSection(){return DATA.sections.find(s=>s.id===sectionId)}
function qs(){return DATA.questions.filter(q=>q.section===sectionId)}
function buildNav(){$('sectionNav').innerHTML=DATA.sections.map(s=>`<button class="${s.id===sectionId?'active':''}" onclick="switchSection(${s.id})">${s.title}</button>`).join('')}
function switchSection(id){sectionId=id;index=0;buildNav();render()}
function render(){let s=currentSection(),list=qs(),q=list[index];$('sectionTag').textContent=`SECTION ${sectionId} / 6`;$('sectionTitle').textContent=s.title;$('qnum').textContent=`QUESTION ${q.n}`;$('progress').textContent=`${index+1} / ${list.length}`;$('prompt').textContent=q.prompt;
let passage=s.text;$('reading').classList.toggle('hidden',!passage);
if(passage){$('passageTitle').textContent=s.passage;$('passageText').textContent=passage;$('translationText').textContent=s.translation||'Bản dịch chưa có trong dữ liệu.';$('translationBox').classList.remove('show');$('translateBtn').textContent='🇻🇳 Show Vietnamese translation'}
if(sectionId===3){
 const lines=(q.arrangementLines||[]).map(x=>`<div class="arrange-line"><b>${x.letter}.</b> ${esc(x.text)}</div>`).join('');
 const opts=Object.entries(q.opts).map(([k,v])=>{let sel=chosen[q.n],cls='';if(sel){if(k===q.answer)cls='correct';else if(k===sel)cls='wrong'}return `<button class="arrange-choice ${cls}" ${sel?'disabled':''} onclick="answer('${k}')"><b>${k}.</b> ${esc(v)}</button>`}).join('');
 $('options').innerHTML=`<div class="arrange-grid"><section class="arrange-panel"><h4>Utterances / Sentences</h4>${lines}</section><section class="arrange-panel"><h4>Choose the correct order</h4>${opts}</section></div>`;
}else{
 $('options').innerHTML=Object.entries(q.opts).map(([k,v])=>{let sel=chosen[q.n],cls='';if(sel){if(k===q.answer)cls='correct';else if(k===sel)cls='wrong'}return `<button class="option ${cls}" ${sel?'disabled':''} onclick="answer('${k}')"><b>${k}.</b> ${esc(v)}</button>`}).join('');
}
let fb='';if(chosen[q.n]){let ok=chosen[q.n]===q.answer;fb=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'Correct!':'Not quite.'}</b><br>Correct answer: <b>${q.answer}</b><br><b>Giải thích:</b> ${esc(q.explain)}<br><span class="small">Bạn đã chọn ${chosen[q.n]}.</span></div>`}$('feedback').innerHTML=fb;
$('prev').disabled=index===0;$('next').disabled=index===list.length-1;$('next').textContent=index===list.length-1?'End of section':'Next →';updateScore()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toggleTranslation(){let box=$('translationBox');box.classList.toggle('show');$('translateBtn').textContent=box.classList.contains('show')?'Hide Vietnamese translation':'🇻🇳 Show Vietnamese translation'}
function answer(k){let q=qs()[index];if(chosen[q.n])return;chosen[q.n]=k;render()}
function move(d){index=Math.max(0,Math.min(qs().length-1,index+d));render()}
function updateScore(){let list=qs(),done=list.filter(q=>chosen[q.n]).length,correct=list.filter(q=>chosen[q.n]===q.answer).length;let t=`Score: ${correct} / ${list.length} · Answered: ${done} / ${list.length}`;$('score').textContent=t;$('bottomScore').textContent=t}
function resetSection(){if(!confirm('Reset all answers in this section?'))return;qs().forEach(q=>delete chosen[q.n]);index=0;render()}
